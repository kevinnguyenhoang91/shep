decisions:
  - title: Env flag is SHEP_E2E_MOCK_AGENT, separate from SHEP_MOCK_EXECUTOR
    chosen: New flag, new executor class
    rejected:
      - Extend SHEP_MOCK_EXECUTOR — too narrow scope today; risks regressing integration tests
    rationale: >
      Existing MockAgentExecutorService returns a single JSON reply for the
      new-app prompt and has no concept of streaming or tool calls. Keep it
      for its narrow role; add a superset scenario-replay executor for web
      e2e. Clear boundary, no collision.

  - title: Scenarios are declarative YAML under tests/e2e/web/scenarios/
    chosen: YAML with a versioned schema and js-yaml loader + zod validator
    rejected:
      - TypeScript fixture modules — no schema validation, harder for non-devs
      - JSON scenarios — no comments, harder to review
    rationale: >
      YAML keeps scenarios readable and diff-friendly. zod schema validation
      at load time gives actionable errors. Versioned schema lets us evolve
      the format.

  - title: Real scaffolder runs, only agent + remote adapters mocked
    chosen: Keep IApplicationScaffolder real; mock IAgentExecutorProvider, ICloudDeploymentProvider, IGitHubRepositoryService
    rejected:
      - Fully simulate scaffolding — would miss wiring bugs
      - Mock everything including scaffolder — too removed from production
    rationale: >
      Scaffolder regressed silently inside the packaged Electron build in
      091. Keeping it real exercises the full file-write + overlay +
      operation-log pipeline while isolating the slow / external parts.

  - title: playwright-bdd for Gherkin authoring
    chosen: playwright-bdd@^8
    rejected:
      - '@cucumber/cucumber — older, heavier, weaker Playwright integration'
      - No BDD — loses the reusable-steps-as-infra win
    rationale: >
      Compiles .feature files into Playwright specs and participates in
      Playwright fixtures/reporters. Steps become first-class reusable
      infra.

  - title: Scenario selection via URL query param
    chosen: "?e2eScenario=<name> read by the replay executor via request header/cookie"
    rejected:
      - One scenario per process via env var — forces webServer restarts
      - HTTP control endpoint — adds a prod-visible surface
    rationale: >
      Each Playwright test navigates to a URL with the scenario name. The
      replay executor reads a per-request value, allowing parallel tests
      against a single web server. Production never sees this because it
      is behind SHEP_E2E_MOCK_AGENT.

  - title: Remote adapter mocks live in infrastructure, bound conditionally
    chosen: Mock classes in infrastructure/services/*/mocks/ bound only when flag is set
    rejected:
      - Mocks in tests/ — would require cross-tree imports
      - Separate test-only package — overkill
    rationale: >
      Clean-architecture compatible. Kept in mocks/ subfolders so auditors
      can see them. Excluded from production bundle by the conditional
      binding.

