content: |
  ## Technology Decisions

  **SHEP_E2E_MOCK_AGENT vs extending SHEP_MOCK_EXECUTOR.** Existing
  mock is narrow by design. Overloading it would either break its
  consumers or turn it into a god-class. New, richer
  `ScenarioReplayExecutor` gated by a new flag. Both can be active at
  once; production is unaffected because neither flag is ever set in
  prod builds.

  **YAML scenarios with zod validation.** YAML is the repo's existing
  fixture format. zod gives a typed loader + actionable error messages
  when a scenario is malformed. A `version: 1` field lets us evolve
  the schema without breaking old fixtures.

  **Real scaffolder, mocked externals.** Scaffolder failures were a
  live bug source in 091. External services (Anthropic, Cloudflare,
  GitHub) are rate-limited, slow, costly — those are the ones we mock.

  **playwright-bdd for authoring.** Gherkin steps become a reusable
  library; scenarios are composable data. Cost is one devDep + ~30
  lines of Playwright config to wire `bddgen`.

  ## Library Analysis

  | Library          | Version | License | Why                                                 |
  | ---------------- | ------- | ------- | --------------------------------------------------- |
  | playwright-bdd   | ^8      | MIT     | Gherkin layer over @playwright/test                 |
  | js-yaml          | ^4      | MIT     | Already in repo — scenario YAML loading             |
  | zod              | ^4      | MIT     | Already in repo — scenario schema validation        |

  ## Security Considerations

  The replay executor and mock remote adapters are **bound only** when
  `SHEP_E2E_MOCK_AGENT=1`. Production builds never set this flag. The
  selection header / query param is ignored unless the flag is active,
  so no bypass surface exists outside of test builds. Scenarios contain
  only scripted outputs — no secrets.

  ## Performance Implications

  Replay is CPU-only in-process — no network, no LLM. Scenario turns
  can be played back with configurable `delayMs` so tests verify
  loading states without multi-second latency. Target: golden-path
  scenario completes in <15s on CI. playwright-bdd `bddgen` runs once
  before tests (~200ms).
