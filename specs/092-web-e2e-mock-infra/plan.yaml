  ## Risk Mitigation

  | Risk                                             | Mitigation                                                                 |
  | ------------------------------------------------ | -------------------------------------------------------------------------- |
  | Production DI regression                         | New module only registered when SHEP_E2E_MOCK_AGENT=1; contract test       |
  | Scenario YAML drift vs actual API shapes         | zod schema + generated types from TypeSpec domain models where applicable  |
  | Parallel test pollution (shared webServer)       | Scenario selection per-request via cookie; AsyncLocalStorage per request   |
  | `bddgen` lag / CI flake                          | Run bddgen once in pretest hook; pin playwright-bdd version                 |
  | Temp dir leakage                                 | Use os.tmpdir() + afterEach cleanup; isolate per scenario run              |
  | Future feature forgetting to add a scenario      | CI step that lists features lacking a scenario; infra docs in spec         |
