content: |
  ## Architecture Overview

  ```
  Playwright test (BDD .feature → generated .spec.ts)
       │
       │ navigates to /applications?e2eScenario=new-app-html-elements
       ▼
  Next.js request → middleware cookie writer (e2e-scenario)
       │
       ▼
  Use case (e.g. StartApplicationScaffoldingUseCase)
       │
       │ resolve('IAgentExecutorProvider')
       ▼
  ScenarioReplayExecutorFactory
       │  reads scenario name from AsyncLocalStorage (request-scoped)
       │  loads scenario via loader (cached)
       ▼
  ScenarioReplayExecutor — streams scripted turns:
       ├─ text deltas (w/ optional delayMs)
       ├─ tool calls → delegated to real IApplicationScaffolder
       ├─ file writes → scaffolder produces real files in a temp dir
       └─ turn completion → emits SSE-shaped events
  ```

  Cloud deploy + GitHub ports are also swapped (gated by the same env
  flag) with mocks that return scripted results from the same scenario
  YAML — so "Get Online" scenarios can be added later without new infra.

  ## Implementation Strategy

  **Phase 1** lays the data foundation: a zod schema for the YAML
  format and a loader that validates at startup (fail fast). RED
  tests cover malformed scenarios. No other code touches the loader
  yet, so this phase is isolable and reviewable on its own.

  **Phase 2** adds the replay executor behind the existing port.
  Because the DI token is a string, we only need to swap the factory
  binding. RED tests assert turn streaming order, text-delta grouping,
  tool-call dispatch, and scenario-not-found error handling.

  **Phase 3** adds the two remote mocks in parallel — they're
  independent of each other and of the executor. Each mock reads its
  responses from a `mocks:` section of the scenario, so the scenario
  YAML is the single source of truth for a test run.

  **Phase 4** wires playwright-bdd into the existing playwright.config.ts.
  `bddgen` runs once before the test project. Step definitions use
  injected page objects. Scenario selection is via Gherkin background
  step `Given I am running scenario "<name>"`.

  **Phase 5** writes the first scenario + `.feature` as the reference
  implementation — hard-coded HTML element additions, no deploy. This
  validates the whole stack end-to-end.

  **Phase 6** wires a CI job that runs the BDD suite with
  SHEP_E2E_MOCK_AGENT=1 on ubuntu-latest. Docs land in
  `docs/development/e2e-testing.md`.

  ## Clean Architecture Alignment

  The infra respects Clean Architecture boundaries: the replay executor is
  an infrastructure adapter behind the existing `IAgentExecutorProvider`
  port; the mock cloud/github services sit behind their respective ports;
  no use case or domain code is modified. Test code imports only domain
  types, not infrastructure internals.

  ## Testing Strategy (TDD: RED → GREEN → REFACTOR)

  Every implementation task follows the RED → GREEN → REFACTOR cycle.
  RED tests are committed first (failing), then GREEN minimal code, then
  REFACTOR cleanups while keeping tests green.

  **Unit (vitest) — scenario loader & schema**
  - RED: invalid YAML throws with line/column
  - RED: missing `version` field → clear error
  - RED: duplicate scenario names in a folder → error
  - GREEN: load + index by name; round-trip test fixtures

  **Unit (vitest) — scenario-replay executor**
  - RED: streams text deltas in order, honoring `delayMs`
  - RED: dispatches tool calls via injected IApplicationScaffolder
  - RED: throws if scenario name isn't set in request context
  - GREEN: implement incrementally to pass each test

  **Unit (vitest) — DI binding**
  - RED: with flag off, token resolves to real factory
  - RED: with flag on, token resolves to ScenarioReplayExecutorFactory
  - GREEN: `registerE2EMocks()` wired into container bootstrap

  **Integration (vitest) — remote mocks**
  - RED: mock cloud provider returns scripted URLs + status
  - RED: mock github service simulates a collision → auto-retry suffix
  - GREEN: minimal class bodies

  **E2E (playwright-bdd) — golden-path feature**
  - RED: `.feature` file fails (no steps) → steps missing error
  - GREEN: implement steps; verify full scenario passes on ubuntu-latest

