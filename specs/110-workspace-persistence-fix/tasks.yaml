    acceptanceCriteria:
      - A test creates two or more workspaces via createWorkspace(), unmounts the hook, remounts it (simulating browser reopen), and asserts all created workspaces plus the correct activeWorkspaceId are present.
      - A test covers deleting a non-active workspace and renaming a workspace, then remounting, to confirm those mutations also survive.
      - Existing Control Center tests (control-center, control-center-integration, control-center-empty-state, use-control-center-state) pass unmodified.
      - pnpm test:unit passes with zero failures.
    tdd:
      red:
        - 'Write a test using @testing-library/react renderHook + unmount/rerender (or a fresh renderHook call reading the same localStorage) that creates two workspaces, tears down the hook, mounts a new instance, and asserts both workspaces and the active id are still present — this should fail against the pre-fix hook.'
        - 'Write a test for rename/delete mutations surviving the same remount pattern.'
      green:
        - 'No new production code expected beyond task-1''s fix; this task should pass once task-1''s implementation lands. If a gap is found, extend the task-1 fix minimally to close it.'
      refactor:
        - 'Factor the "create workspaces, remount, assert survival" setup into a small test helper shared by the new test cases to avoid duplication.'
    estimatedEffort: S

