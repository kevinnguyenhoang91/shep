tasks:
  - id: task-1
    title: Fix the hydrate/persist race and referential-identity bug in useWorkspaces
    description: >
      Guard the persist effect in `useWorkspaces` behind a `useRef`-based
      hydration flag so it cannot write to `localStorage` until hydration has
      completed, and make every branch of `loadState()` return a freshly
      constructed object instead of the shared `INITIAL_STATE` reference so
      React always detects the hydration state change.
    state: Todo
    dependencies: []
    acceptanceCriteria:
      - loadState() returns a new object (not the INITIAL_STATE reference) from every branch: undefined window, missing localStorage key, malformed JSON, non-array workspaces, and the valid-data path.
      - The persist effect (saveState) does not call localStorage.setItem until after the hydration effect has set isHydratedRef.current to true.
      - A workspace created immediately after mount is not overwritten by a stale pre-hydration persist write.
      - pnpm typecheck and pnpm lint pass with no new errors.
    tdd:
      red:
        - 'Write a test asserting loadState() called with a valid stored payload, an empty payload, and a malformed payload each return an object that is not referentially equal to INITIAL_STATE.'
        - 'Write a test that mounts useWorkspaces, immediately calls createWorkspace(), and asserts the final localStorage.setItem call contains the created workspace (not just the default).'
        - 'Write a test asserting localStorage.setItem is not called on the very first effect flush before the hydration effect has resolved.'
      green:
        - 'Add an isHydratedRef = useRef(false) to useWorkspaces; set it to true inside the hydration effect after setState(loaded).'
        - 'Add `if (!isHydratedRef.current) return;` as the first line of the persist effect.'
        - 'Rewrite loadState() so every return statement constructs a new object literal (e.g. `{ workspaces: INITIAL_STATE.workspaces, activeWorkspaceId: INITIAL_STATE.activeWorkspaceId }`) instead of `return INITIAL_STATE`.'
      refactor:
        - 'Extract a small `freshInitialState()` helper used by every early-return branch in loadState() to avoid repeating the object-literal shape four times.'
        - 'Add a one-line comment above the persist effect explaining why the hydration guard is required (races with the hydration effect on mount).'
    estimatedEffort: S

  - id: task-2
    title: Add regression coverage for multi-workspace persistence across a simulated browser reopen
    description: >
      Extend the test suite for `useWorkspaces` to cover the exact end-to-end
      scenario the user reported: creating multiple workspaces, then
      simulating a browser close/reopen by unmounting and remounting the
      hook, and asserting all workspaces and the active workspace selection
