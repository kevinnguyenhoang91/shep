# Structured technology decisions
decisions:
  - title: Keep workspaces client-only (localStorage) rather than promoting to backend persistence
    chosen: Fix the localStorage race in useWorkspaces(); leave the prototype boundary in place
    rejected:
      - Promote Workspace to a full Clean Architecture entity (tsp model, domain, use cases, SQLite repository/migration)
      - Move persistence to sessionStorage
    rationale: >
      use-workspaces.ts explicitly documents itself as a prototype boundary with
      no backend, domain model, or infrastructure adapter. The reported bug is a
      client-side race condition, not a missing backend — grepping
      packages/core/src/domain, application/use-cases, infrastructure/persistence
      and tsp/ confirms there is no existing Workspace persistence layer to wire
      up. Promoting workspaces to backend-persisted entities is a materially
      larger feature (new tsp model, migration, repository, use cases, server
      actions) that is out of scope for a bug fix and would violate the
      single-responsibility scope of this spec. sessionStorage would make the
      bug worse, not better, since it is cleared on tab close by design.
  - title: Race-condition fix strategy in useWorkspaces
    chosen: useRef-based hydration guard gating the persist effect, plus fresh-object returns from every loadState() branch
    rejected:
      - Merge hydrate and persist into a single combined useEffect
      - Rewrite the hook around useSyncExternalStore
      - Debounce/delay the persist effect
    rationale: >
      A useRef flag (isHydratedRef) is set synchronously inside the hydration
      effect and read by the persist effect on the same render pass, so the
      persist effect is a guaranteed no-op until hydration has actually run —
      no timing assumption needed. Combining the effects into one would work
      but couples two concerns (read-on-mount vs. write-on-change) that are
      naturally separate follow-up effects; keeping them separate with an
      explicit guard is more readable and mirrors the previously validated fix
      for this exact bug (commit ebff256d25fb on the now-superseded
      feat/workspace-persistence-fix branch, spec 114, which was correct but
      never merged for unrelated scope-hygiene reasons). useSyncExternalStore
      is a bigger rewrite than the bug warrants. Debouncing treats a symptom
      (extra writes) without fixing the actual defect (writing stale data).
      Separately, every loadState() branch must return a fresh object
      (`{ workspaces: INITIAL_STATE.workspaces, activeWorkspaceId: ... }`
      rather than `return INITIAL_STATE`), because React's setState bails out
      on referential equality — returning the literal INITIAL_STATE reference
      silently skips the hydration re-render entirely.

