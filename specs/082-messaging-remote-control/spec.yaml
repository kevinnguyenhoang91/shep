content: |
  ## Problem Statement

  Use commands-com gateway and build external control over shep.

  ## Success Criteria

  **Phase 1 — core scaffolding (done):**
  - [x] TypeSpec domain models for messaging (commands, config, notifications, platform)
  - [x] Messaging service skeleton with tunnel adapter, chat relay, command executor, notification emitter
  - [x] Content sanitizer for safe message handling
  - [x] CLI commands for messaging configuration
  - [x] DI container registration for messaging service (lazy factory)
  - [x] Integration with _serve command for daemon lifecycle
  - [x] Unit tests for all messaging components (initial 39 tests passing)

  **Phase 2 — pairing use cases + web UI (done):**
  - [x] BeginMessagingPairing / ConfirmMessagingPairing / DisconnectMessaging use cases
  - [x] Web settings section with pairing modal (code + chatId confirm flow)
  - [x] CLI wizard refactored to share the same pairing use cases (presentation-agnostic)
  - [x] E2E Playwright test for the web pairing flow
  - [x] Storybook stories + unit test for the messaging settings component

  **Phase 3 — real gateway integration (in progress):**

  Gateway protocol research showed the existing MessagingTunnelAdapter was built against a
  hypothetical protocol. The real Commands.com Gateway uses `tunnel.request` / `tunnel.response`
  frames, requires bearer-token auth on the WebSocket upgrade, and routes public webhooks via
  integration routes that must be registered through `POST /gateway/v1/integrations/routes`.
  Telegram replies are outbound HTTPS calls to `api.telegram.org`, NOT tunnel frames.

  - [x] TypeSpec: extend MessagingConfig with deviceId, gatewayClientId, per-platform routeId/routeToken/publicUrl
  - [x] IGatewayClient port interface (oauth token + create integration route)
  - [x] HttpGatewayClient adapter implementation against gateway OpenAPI spec
  - [x] Unit tests for HttpGatewayClient using fetch mocks (7 tests)
  - [x] BeginMessagingPairingUseCase extended to fetch OAuth token + create route + return publicUrl
  - [x] Updated use case tests cover the new gateway client integration (9 tests)
  - [x] Web pairing dialog shows publicUrl with copy button and setup instructions
  - [x] CLI pairing wizard displays publicUrl and sample Telegram setWebhook curl
  - [x] DI container wires HttpGatewayClient
  - [x] Rewrite MessagingTunnelAdapter to speak real tunnel protocol (tunnel.activate / tunnel.request / tunnel.response)
  - [x] Switch from global WebSocket to the `ws` npm library so bearer headers can be set on upgrade
  - [x] Fetch OAuth access token at DI resolution and pass into MessagingService (no more empty authToken)
  - [x] IMessageSender output port decouples chat-relay + notification-emitter from the tunnel
  - [x] TelegramMessageSender implements IMessageSender via the Telegram Bot API
  - [x] HttpTelegramClient adapter (sendMessage) with unit tests
  - [x] telegram-webhook.parser extracts chat_id + text from Telegram Update payloads (+ pair command parser)
  - [x] MessagingService decodes tunnel.request frames as Telegram updates and dispatches slash commands via MessagingCommandExecutor
  - [x] Auto-confirm pairing: `/pair <code>` inbound messages call ConfirmMessagingPairingUseCase
  - [x] docs/development/messaging-local-setup.md — full cloudflared/ngrok walkthrough
  **Phase 4 — parity polish (done):**
  - [x] Per-platform botToken field on MessagingPlatformConfig (TypeSpec)
  - [x] Web settings: bot token input appears for paired platforms with password masking
  - [x] CLI wizard: prompts for bot token after confirming pairing
  - [x] DI: bot token precedence is settings.db > SHEP_TELEGRAM_BOT_TOKEN env var
  - [x] WhatsApp webhook parser (Business Cloud API shape) with unit tests
  - [x] MessagingService dispatches Telegram OR WhatsApp inbound webhooks based on route → platform resolution
  - [x] Interactive /chat <featureId> relay: subscribes to the IInteractiveSessionService stream and forwards agent deltas to the chat
  - [x] /end command tears down the subscription via unsubscribe handle owned by MessagingChatRelay
  - [x] Free-form messages during an active relay are forwarded via IInteractiveSessionService.sendUserMessage
  - [x] MessagingCommandType enum extended with list/chat/end/help

  **Remaining (out of scope for 082):**
  - [ ] WhatsApp Business Cloud API outbound client (sendMessage) — requires a verified Meta dev app and is substantially more involved than Telegram
  - [ ] Integration test using a real local gateway process in CI (spin up the Go binary in a GitHub Actions runner)

