  | CLI surface (`src/presentation/cli/commands/cluster/`) | Low | Should be checked for parity — if `shep cluster status` or similar reads `errorMessage`, it inherits the same fix for free once the use case layer is correct (per "presentation-agnostic core API" rule). |

  ## Dependencies

  - Existing `Cluster.errorMessage` domain field and its persistence plumbing (no changes needed
    to the field itself).
  - Existing `IClusterAgentProcessService` port (`isAlive`, `kill`) — reused, not replaced.
  - Existing LangGraph error-routing pattern (`routeOrError`, `handle-error` node) in
    `cluster-agent-graph.ts` — the crash-handling fix must stay consistent with this pattern rather
    than introduce a second error-reporting mechanism.
  - Existing 3s polling hook `useClusterEvents()` — the delivery mechanism for any new staleness
    signal to the UI; no new transport (SSE, WebSocket) needed.
  - TDD/TypeSpec-first workflow: any new persisted field must go through `tsp/` → `pnpm tsp:codegen`
    → migration → mapper → repository, per project mandatory rules.

  ## Size Estimate

  **M** — This is not a UI feature (display of `errorMessage` already works) but a backend
  reliability fix spanning three layers: (1) worker-level crash handling for two previously
  unhandled failure paths, (2) a new persisted field (PID) with full migration/mapper/repository
  wiring, and (3) a new or extended use case for liveness/staleness detection wired into the
  existing polling route. Each piece is individually small, but per LESSONS.md's recurring
  "settings/entity column" failure pattern, the column-wiring alone touches 4+ files that must
  stay in sync, and correctness requires new integration tests simulating a killed/hung worker
  process — not just unit tests with mocks. No new UI surfaces or Storybook stories are required.
  Estimated at low-to-mid single-digit days, not hours (S) and not a multi-week redesign (L/XL).

