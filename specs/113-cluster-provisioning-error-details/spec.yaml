content: |
  ## Problem Statement

  Users report clusters getting "stuck" in `Provisioning` status with no indication of what went
  wrong. Investigation shows the domain and UI plumbing for error reporting already exist and
  work correctly *when the cluster-agent graph reaches its error terminal node*:

  - `Cluster.errorMessage` (`tsp/domain/entities/cluster.tsp:139`) is a first-class field.
  - The graph's `handle-error` node (`packages/core/src/infrastructure/services/agents/cluster-agent/nodes/error.ts`)
    persists `status: Error` + `errorMessage` whenever any node sets `state.error`.
  - The web UI already renders `errorMessage` in three places: the cluster list card
    (`clusters-page-client.tsx:293`), the detail drawer overview tab
    (`cluster-detail-drawer.tsx:183`), and it flows through `useClusterEvents()`
    (`hooks/use-cluster-events.ts`), which polls `/api/clusters` every 3s.

  So when a provisioning node fails cleanly (bad k3d binary, Docker not running, health-check
  timeout, etc.), the user already sees a specific, translated error message. **The bug is that
  several realistic failure modes never reach that clean path**, leaving the cluster silently
  parked in `Provisioning`:

  1. **Global crash handlers don't update cluster status.** In
     `cluster-agent-worker.ts`, `process.on('uncaughtException', ...)` and
     `process.on('unhandledRejection', ...)` (lines 218-226) log to the worker's log file and call
     `process.exit(1)` — but never call `clusterRepo.update(..., { status: Error, errorMessage })`.
     Only the `try/catch` inside `runClusterWorker()` (lines 198-213) does that. Any error that
     escapes the graph invocation via an unhandled promise rejection (plausible given
     `k3dService`/`kubectlService`/`argoCdService` shell out to CLIs) leaves the cluster in
     `Provisioning` forever with no `errorMessage`.

  2. **The spawned worker's PID is discarded, so nothing can detect a dead/hung worker.**
     `ProvisionClusterUseCase.execute()` (`provision-cluster.use-case.ts:40`) calls
     `this.processService.spawn(...)` and ignores the returned PID. `IClusterAgentProcessService`
     already exposes `isAlive(pid)` (`cluster-agent-process-service.interface.ts:38`) — the same
     primitive the feature-agent side presumably uses for liveness — but for clusters there is no
     column to store the PID and no code path that ever calls `isAlive()`. A worker killed by
     SIGKILL/OOM, or one that hangs indefinitely inside a native CLI call with no timeout
     (`configure-kubectl`/`install-argocd` were not confirmed to have the same timeout discipline as
     `health-check.ts`'s 120s exponential backoff), leaves `Provisioning` with a heartbeat
     (`lastHealthCheckAt`) that simply stops advancing — and nothing ever notices.

  3. **No staleness/reconciliation check exists anywhere in the read path.** `GetClusterStatusUseCase`
     and `ListClustersUseCase` both do a straight `clusterRepo.findById`/`list()` — neither compares
     `lastHealthCheckAt`/`lastProvisionedAt` against "now" nor checks process liveness. The 3s poll
     in `useClusterEvents()` is the natural place this reconciliation would surface, but there is
     currently no use case for it to call.

  ## Codebase Analysis

  ### Project Structure
  - `tsp/domain/entities/cluster.tsp` + `tsp/common/enums/cluster.tsp` — TypeSpec source of truth
    for the `Cluster` entity and `ClusterStatus` enum; compiles to
    `packages/core/src/domain/generated/output.ts` (never hand-edited).
  - `packages/core/src/application/use-cases/clusters/` — Clean Architecture use cases
    (`create`, `provision`, `destroy`, `update`, `get`, `get-cluster-status`, `list`, `delete`).
  - `packages/core/src/application/ports/output/services/cluster-agent-process-service.interface.ts`
    — port for spawning/probing the worker process (`spawn`, `isAlive`, `kill`).
  - `packages/core/src/infrastructure/services/agents/cluster-agent/` — the LangGraph-based
    provisioning agent: `cluster-agent-graph.ts` (node wiring + error routing),
    `cluster-agent-worker.ts` (forked child-process entry point, heartbeat, signal handling),
    `cluster-agent-process.service.ts` (fork/isAlive/kill implementation), and per-step `nodes/`
    (`prerequisite-check`, `provision`, `configure-kubectl`, `install-argocd`, `health-check`,
    `ready`, `error`).
  - `packages/core/src/infrastructure/repositories/sqlite-cluster.repository.ts` +
    `infrastructure/persistence/sqlite/mappers/cluster.mapper.ts` — persistence; migrations under
    `infrastructure/persistence/sqlite/migrations/125-*` through `128-*`.
  - `src/presentation/web/components/common/cluster-node/` — `cluster-node.tsx` (canvas card),
    `cluster-status-badge.tsx`, `cluster-detail-drawer.tsx` (existing `errorMessage` display).
  - `src/presentation/web/components/features/clusters/clusters-page-client.tsx` — list view
    (existing `errorMessage` display on cards).
  - `src/presentation/web/hooks/use-cluster-events.ts` — 3s polling hook backing both surfaces.
  - `src/presentation/web/app/api/clusters/` — REST-ish API routes consumed by the web client
    (`route.ts` for list, `[id]/status/route.ts`, `[id]/provision/route.ts`, etc.).

  ### Architecture Patterns
  - Clean Architecture: presentation (web components/hooks/API routes) → application use cases →
    domain (generated TypeSpec types) → infrastructure (SQLite repo, LangGraph agent, CLI
    wrappers). This feature's fixes are almost entirely in infrastructure (worker crash handling,
    PID capture) and application (a new/extended use case for staleness detection), with the domain
    model needing one additive field (a PID or "last worker check" concept) and no UI changes to the
    *display* layer — only to the data it's fed.
  - The cluster-agent graph follows the same LangGraph `StateGraph` + node-factory pattern as the
    feature-agent graph (`routeOrError`, terminal `handle-error` node). Any fix to error visibility
    should preserve that symmetry rather than special-casing clusters.
  - `IClusterAgentProcessService` is the sanctioned seam for anything process-liveness related
    (per the "No Direct Infrastructure Imports" rule) — a staleness-detection use case must depend
    on this port, not reach into `child_process` directly.

  ### Relevant Technologies
  - LangGraph `StateGraph` (`@langchain/langgraph`) drives the multi-step provisioning flow with a
    checkpointer (`createCheckpointer`) for resume-after-failure.
  - `child_process.fork()` with `detached: true` spawns the worker; PID lifecycle and IPC
    disconnect are already partially handled but not persisted.
  - SQLite via `better-sqlite3` for the `clusters` table (`errorMessage`, `lastHealthCheckAt`,
    `lastProvisionedAt` columns already exist per LESSONS.md's "repository INSERT/UPDATE must
    include all columns" pattern — must re-verify when adding a new column).
  - Next.js polling (not SSE) is the existing real-time mechanism for cluster state — consistent
    with `useClusterEvents()`, not the SSE architecture documented for features/repos.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
