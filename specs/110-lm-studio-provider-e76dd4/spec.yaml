# Markdown content (the actual spec)
content: |
  ## Problem Statement

  Users need the ability to run Shep's LLM inference locally using LM Studio, a popular desktop application
  that provides local inference through an OpenAI-compatible API. Currently, the system supports various agents
  (Claude Code, Cursor, Cline) and cloud providers (OpenRouter, Together AI) and local alternatives (Ollama,
  LLMProxy), but lacks explicit support for LM Studio. This limits users who prefer LM Studio for:

  - **Local development**: Run code generation entirely offline without cloud API costs
  - **Model experimentation**: Test multiple local models without switching providers
  - **Privacy**: Keep all inference and proprietary code local to the machine
  - **Custom workflows**: Integrate with existing LM Studio setups that may have custom models or configurations

  ## Success Criteria

  - [ ] LmStudio enum variant added to AgentType in `tsp/common/enums/agent-config.tsp`
  - [ ] `pnpm tsp:compile` regenerates domain types with LmStudio included in AgentType union
  - [ ] `LmStudioExecutorService` created at `packages/core/src/infrastructure/services/agents/common/executors/lm-studio-executor.service.ts`
  - [ ] LmStudioExecutorService extends AiSdkBaseExecutorService and implements createModel() correctly
  - [ ] AgentExecutorFactory includes case for 'lm-studio' that instantiates LmStudioExecutorService
  - [ ] getSupportedAgents() method in factory returns array including 'lm-studio'
  - [ ] `lm-studio-executor.service.ts` is <50 lines of code
  - [ ] LM_STUDIO_MODELS exported from agent-model-catalog with at least 5 common models
  - [ ] Unit tests for LmStudioExecutorService (>=80% coverage for LM Studio-specific code)
  - [ ] Integration test confirms executor can be created and configured
  - [ ] Error test confirms LM Studio connection failure shows helpful error message
  - [ ] Streaming mode test confirms executeStream() works correctly
  - [ ] Non-streaming mode test confirms execute() works correctly
  - [ ] Agent factory test updated to verify lm-studio case branch
  - [ ] TypeSpec JSDoc includes LM Studio description and documentation URL
  - [ ] AGENTS.md documentation updated to list LM Studio as supported provider
  - [ ] All local tests pass: `pnpm test:unit && pnpm test:int`
  - [ ] TypeScript compilation succeeds: `pnpm typecheck`
  - [ ] Linting passes: `pnpm lint:fix`
  - [ ] Build succeeds: `pnpm build`
  - [ ] No new dependencies added to package.json
  - [ ] CI/CD checks pass on remote

  ## Functional Requirements

  - **FR-1**: System must register LmStudio as a supported AgentType, discoverable via `getSupportedAgents()` in AgentExecutorFactory
  - **FR-2**: System must instantiate LmStudioExecutorService when LmStudio is selected as the active agent
  - **FR-3**: System must route LLM calls (generateText, streamText, generateObject) through LM Studio via OpenAI-compatible API at configured endpoint
  - **FR-4**: System must support streaming execution mode through executeStream() method
  - **FR-5**: System must support non-streaming execution mode through execute() method
  - **FR-6**: System must accept user-provided model names and pass them through to LM Studio
  - **FR-7**: System must handle connection failures to LM Studio with clear, actionable error messages including the endpoint and setup documentation URL
  - **FR-8**: System must respect endpoint configuration from settings, allowing override of default localhost:1234
  - **FR-9**: System must work offline—no external API calls, all communication local to configured LM Studio instance
  - **FR-10**: System must follow existing AiSdkBaseExecutorService pattern, requiring only createModel() implementation

  ## Non-Functional Requirements

  - **NFR-1**: LmStudioExecutorService implementation must be <=50 lines of code (excluding tests)
  - **NFR-2**: No new external dependencies required—must use existing @ai-sdk/openai-compatible provider
  - **NFR-3**: Code must follow clean architecture: no infrastructure imports in application/presentation layers
  - **NFR-4**: Unit test coverage for LM Studio-specific code must be >=80%
  - **NFR-5**: Executor must be stateless and reusable across multiple concurrent agent invocations
  - **NFR-6**: LM Studio feature must be fully compatible with existing Ollama, LLMProxy, and cloud provider executors
  - **NFR-7**: Default model behavior must match Ollama pattern (delegate to LM Studio's runtime selection)
  - **NFR-8**: API compatibility must match OpenAI-compatible standard, requiring no custom formatting or transformations
  - **NFR-9**: Error messages must include setup documentation URL (https://lmstudio.ai/docs/local-server) to reduce support friction
  - **NFR-10**: Dependency injection must resolve LmStudioExecutorService via factory pattern, never hardcoded global singletons

  ## Product Questions & Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Default model selection | Use LM Studio default (no explicit model name) | Mirrors Ollama pattern, respects user's LM Studio setup, minimal configuration friction |
  | 2 | API endpoint configuration | Configurable via settings | Supports advanced users with non-standard ports or custom deployments, proven pattern (LLMProxy) |
  | 3 | API key/authentication | No API key required | Matches LM Studio's unauthenticated local default, reduces setup friction |
  | 4 | Health check strategy | Lazy validation on first use | Fast initialization, consistent with Ollama/LLMProxy, errors discovered during actual use |
  | 5 | Model list management | Hardcoded curated list | Zero runtime overhead, aids UI discoverability, matches Ollama pattern, easy user override |
  | 6 | Connection error handling | LM Studio-specific error messages | Actionable errors with setup documentation reduce support burden and improve UX |
  | 7 | TypeSpec documentation | Detailed comment with links | Self-documenting, aids discoverability in code, includes setup reference |

  ## Codebase Analysis

  ### Project Structure

  The repository is organized as a monorepo with clean architecture principles:

  ```
  packages/core/src/
  ├── domain/              # Business logic, TypeSpec-generated types
  ├── application/         # Use cases, port interfaces (no external deps)
  ├── infrastructure/      # External services, executor implementations
  │   └── services/agents/
  │       └── common/
  │           ├── executors/          # Agent executor implementations
  │           ├── agent-executor-factory.service.ts
  │           └── agent-model-catalog.ts
  └── presentation/        # CLI, Web UI

  tsp/                      # TypeSpec definitions (source of truth for domain models)
  └── common/enums/agent-config.tsp
  ```

  ### Architecture Patterns

  **Agent Executor System**: The codebase uses an extensible executor pattern based on the Vercel AI SDK:

  1. **IAgentExecutor interface**: Abstract interface defining `execute()`, `executeStream()`, and feature detection
  2. **AiSdkBaseExecutorService**: Abstract base class implementing IAgentExecutor using AI SDK's `generateText`, `streamText`, and `generateObject` functions
  3. **Concrete executor implementations**: Subclasses (OllamaExecutorService, OpenRouterExecutorService, etc.) extend AiSdkBaseExecutorService and implement only `createModel()` + set `agentType`
  4. **AgentExecutorFactory**: Factory pattern with switch statement to instantiate executors by AgentType, with per-type caching
  5. **Settings-driven resolution**: All agent selection flows through `IAgentExecutorProvider.createExecutor()` resolved from settings, never hardcoded

  **TypeSpec Integration**: Domain types are generated from TypeSpec definitions in `tsp/`. The AgentType enum (`tsp/common/enums/agent-config.tsp`) is the single source of truth — editing it triggers `pnpm tsp:compile` to regenerate `packages/core/src/domain/generated/output.ts`.

  **Dependency Injection**: The codebase uses `tsyringe` for DI. The factory is wired in the container and lazily creates executors on demand. No global singletons for providers.

  ### Relevant Technologies

  - **Vercel AI SDK** (`ai` package v6+): Provides unified interface to multiple LLM providers via `generateText()`, `streamText()`, `generateObject()`, and response mapping
  - **@ai-sdk/openai-compatible**: Community provider enabling OpenAI-compatible endpoints (HTTP APIs conforming to OpenAI's spec)
  - **TypeSpec**: Declarative schema language for generating TypeScript types, used for domain model definitions and downstream code generation
  - **tsyringe**: Lightweight IoC container for dependency injection

  ### Existing Similar Implementations

  **OllamaExecutorService** (`infrastructure/services/agents/common/executors/ollama-executor.service.ts`):
  - Extends AiSdkBaseExecutorService
  - Uses `@ai-sdk/openai-compatible` to connect to `http://localhost:11434/v1`
  - Passes empty string as apiKey (Ollama doesn't require auth)
  - Defines a default model and accepts user-provided model IDs
  - ~30 lines of implementation

  **LLMProxyExecutorService** (`infrastructure/services/agents/common/executors/llmproxy-executor.service.ts`):
  - Extends AiSdkBaseExecutorService
  - Uses `@ai-sdk/openai-compatible` to connect to `http://localhost:4000/v1`
  - Also passes empty string or provided token as apiKey
  - Supports dynamic model selection

  Both are registered in AgentExecutorFactory's switch statement and getSupportedAgents() method. This is the pattern LM Studio will follow.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `tsp/common/enums/agent-config.tsp` | Low | Add `LmStudio: "lm-studio"` to the AgentType enum with descriptive JSDoc. Regenerating TypeSpec will auto-update domain types. |
  | `packages/core/src/domain/generated/output.ts` | Low | Auto-generated from TypeSpec; no manual edits. AgentType enum will include the new LmStudio variant. |
  | `packages/core/src/infrastructure/services/agents/common/executors/lm-studio-executor.service.ts` | Medium | Create new service extending AiSdkBaseExecutorService, implementing createModel() to use @ai-sdk/openai-compatible with http://localhost:1234/v1 (configurable). Support endpoint and model configuration from settings. |
  | `packages/core/src/infrastructure/services/agents/common/agent-executor-factory.service.ts` | Low | Add case for 'lm-studio' in createExecutor() switch, instantiating LmStudioExecutorService. Update getSupportedAgents() array to include 'lm-studio'. |
  | `packages/core/src/infrastructure/services/agents/common/agent-model-catalog.ts` | Low | Export LM_STUDIO_MODELS array with common models (llama2, deepseek, mistral, codellama, phi, neural-chat, etc.). Import and reference in factory. |
  | Tests | Low | Add unit tests for LmStudioExecutorService (createModel, model configuration, error handling). Add integration test to verify factory creates LM Studio executor. Update factory tests to verify lm-studio case branch. |
  | Documentation | Low | Update agent-config.tsp JSDoc to describe LM Studio and link to https://lmstudio.ai/docs/local-server. Update AGENTS.md if it lists supported providers. |

  ## Dependencies

  **Existing**:
  - `@ai-sdk/openai-compatible` (already in package.json for Ollama/LLMProxy)
  - Vercel AI SDK `generateText()`, `streamText()` (already in use)
  - TypeSpec (already the system for domain model generation)

  **No new dependencies required**. LM Studio uses the OpenAI-compatible API (HTTP), so the same `@ai-sdk/openai-compatible` provider that powers Ollama and LLMProxy can be reused.

  ## Size Estimate

  **S (Small)** — The implementation closely mirrors existing Ollama and LLMProxy support and follows an established, battle-tested pattern:

  - Executor implementation: ~30 lines (subclass AiSdkBaseExecutorService, implement createModel)
  - Factory wiring: 2–3 lines in switch, 1 line in array
  - Model catalog: ~10 lines of model list
  - Tests: ~80 lines (unit + integration tests paralleling Ollama)
  - TypeSpec enum: 5 lines + JSDoc

  Zero architectural complexity, zero new dependencies, reuses proven abstractions. Product decisions above eliminate unknowns around configuration, error handling, and compatibility.

