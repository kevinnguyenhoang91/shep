content: |
  ## Problem Statement

  In the Agent Sessions popup (session-row.tsx), the `Open in IDE` action uses a hardcoded VSCode deep-link (`window.open('vscode://file{path}')`),
  while the project card (repository-drawer.tsx) uses a sophisticated server action that respects the user's configured default editor and supports multiple editor types (VSCode, Cursor, etc.).

  Similarly, the `Resume in Terminal` action in the session popup could benefit from the cross-platform terminal handling logic already in the project card's `openShell` server action.

  This inconsistency means:
  - Session users are forced to use VSCode, ignoring their editor preferences
  - Session actions don't benefit from the editor availability checks and error handling in place for project cards
  - Platform-specific terminal behavior (macOS osascript, Linux x-terminal-emulator, Windows PowerShell) is not leveraged for resume flows

  ## Success Criteria

  - [ ] Session row "Open in IDE" button calls openIde server action instead of hardcoded window.open()
  - [ ] Session row respects user's configured default editor from settings
  - [ ] Session row supports multiple editors (VSCode, Cursor, Sublime Text, etc.) through LaunchIdeUseCase
  - [ ] Session row displays appropriate error message if configured IDE is unavailable
  - [ ] Session row "Resume in Terminal" uses openShell server action for cross-platform terminal spawning
  - [ ] All IDE/terminal actions display loading state during execution
  - [ ] All IDE/terminal actions have proper error handling with dismissible error messages
  - [ ] No hardcoded VSCode URIs remain in session-row.tsx
  - [ ] useSessionActions hook created and exported from feature-node directory
  - [ ] Unit tests cover useSessionActions hook (loading/error states, action dispatch)
  - [ ] Integration tests verify open IDE and resume terminal flows from session row
  - [ ] Session row behavior matches project card UX patterns for IDE/terminal operations
  - [ ] Cross-platform testing passes on macOS, Linux, Windows for terminal operations

  ## Functional Requirements

  - **FR-1**: Session row "Open in IDE" action must validate the repository path is absolute before calling openIde server action
  - **FR-2**: Session row must retrieve user's configured default editor from settings service and pass it to openIde
  - **FR-3**: Session row must support all editors that LaunchIdeUseCase supports (VSCode, Cursor, Sublime Text, etc.)
  - **FR-4**: Session row must display appropriate error message if the configured IDE is not available on the system
  - **FR-5**: Session row "Resume in Terminal" action must call openShell server action with validated repository path
  - **FR-6**: Session row must display loading state while IDE/terminal operations are in progress
  - **FR-7**: Session row must display dismissible error messages for IDE/terminal operation failures
  - **FR-8**: Session row must clear error messages when the user opens the error message or after a timeout
  - **FR-9**: useSessionActions hook must manage state for: loading, error, and selected session ID
  - **FR-10**: useSessionActions hook must provide unified interface for adopt, resume, open IDE, and open folder actions

  ## Non-Functional Requirements

  - **NFR-1**: Code reuse — no duplication of IDE/terminal logic; must reuse existing openIde and openShell server actions
  - **NFR-2**: Consistency — session row UI/UX must match project card behavior for IDE/terminal operations
  - **NFR-3**: Cross-platform — terminal operations must work correctly on macOS (osascript), Linux (x-terminal-emulator), and Windows (PowerShell)
  - **NFR-4**: Performance — IDE/terminal operations must complete within 5 seconds or display appropriate timeout error
  - **NFR-5**: Security — repository paths must be validated (absolute paths only) and properly escaped for shell safety
  - **NFR-6**: Maintainability — follow Clean Architecture patterns; presentation layer remains thin; all business logic stays in use cases
  - **NFR-7**: Maintainability — useSessionActions hook must be clearly documented with JSDoc comments on exported functions
  - **NFR-8**: Testing — unit tests must cover all action states (idle, loading, error); integration tests must verify server action calls
  - **NFR-9**: Error messages — must be user-friendly and actionable (not raw server errors)

  ## Product Questions & AI Recommendations

  See `openQuestions` section above for structured product decisions already resolved.

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/presentation/web/components/common/feature-node/session-row.tsx` | High | Contains hardcoded VSCode open and inline terminal resume logic; primary target for refactoring |
  | `src/presentation/web/components/common/feature-node/use-session-actions.ts` (NEW) | High | New hook to be created, mirrors useRepositoryActions pattern; manages state for session actions |
  | `src/presentation/web/app/actions/open-ide.ts` | Medium | No changes needed; will be called from session row via useSessionActions hook |
  | `src/presentation/web/app/actions/open-shell.ts` | Medium | No changes needed; will be called from session row via useSessionActions hook for Resume in Terminal |
  | `src/presentation/web/components/common/feature-node/` | Low | Session popup structure may need minor adjustments to accommodate new hook; error display may be enhanced |
  | `useRepositoryActions` hook | Low | Model for useSessionActions; no changes needed |

  ## Dependencies

  **Existing Code Reused:**
  - `openIde` server action — already exists at `src/presentation/web/app/actions/open-ide.ts`; fully implements IDE resolution and launching
  - `openShell` server action — already exists at `src/presentation/web/app/actions/open-shell.ts`; handles cross-platform terminal spawning
  - `LaunchIdeUseCase` — resolves IDE availability and launches via `packages/core/src/application/use-cases/ide/launch-ide.use-case.ts`
  - `ResumeAgentSessionUseCase` — already integrated with session row; no changes needed
  - `useRepositoryActions` hook — template for useSessionActions hook structure and patterns

  **No New Dependencies:**
  - No new npm packages required
  - No domain model changes (TypeSpec)
  - No database schema changes
  - No new infrastructure services

  ## Implementation Strategy

  **Phase 1: Create useSessionActions Hook**
  - Create `src/presentation/web/components/common/feature-node/use-session-actions.ts`
  - Model structure after `useRepositoryActions` hook
  - Manage state: loading (boolean), error (Error | null), selectedSessionId (string | null)
  - Implement handlers: onAdopt, onResume, onOpenIde, onOpenFolder
  - Add error clearing with 5-second timeout

  **Phase 2: Integrate Server Actions into Session Row**
  - Update `session-row.tsx` to use useSessionActions hook
  - Replace `window.open('vscode://file...')` with `onOpenIde` handler
  - Update "Open in IDE" button to show loading state and error messages
  - Verify "Resume in Terminal" properly calls `onResume` (may already be correct)
  - Remove all hardcoded VSCode URI logic

  **Phase 3: Test & Verification**
  - Unit tests for useSessionActions hook (state transitions, action dispatch)
  - Integration tests for open IDE/terminal flows from sessions
  - Verify openIde respects configured editor preference
  - Cross-platform terminal testing (macOS, Linux, Windows)
  - Error state testing (IDE unavailable, invalid paths, etc.)
  - UI testing: verify loading states, error messages, and dismissal behavior

  ## Size Estimate

  **M** (Medium — 2-3 days) — Justified by:

  - **Straightforward refactoring:** Reusing proven server actions rather than building new logic
  - **Limited scope:** Changes isolated to session row component and new actions hook
  - **No architectural changes:** Follows existing Clean Architecture patterns (Use Cases → Server Actions)
  - **Testing required:** Cross-platform terminal and multi-editor testing adds complexity
  - **Low risk:** Server actions already tested; session row is presentation layer

  **Not L/XL because:**
  - No new use cases needed
  - No database or domain changes
  - Existing infrastructure (IDE launchers, terminal spawning) is proven
  - Changes are primarily in presentation layer

  ---

  _Requirements complete — ready for research phase_
