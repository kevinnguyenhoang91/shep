content: |
  ## Architecture Overview

  ```
  P0 Security         P1 Correctness     P1 Architecture
  ┌──────────┐        ┌──────────┐       ┌──────────────────┐
  │ CVE fixes│        │ SSE batch│       │ DI modularization│
  │ Path san.│        │ Exec bugs│       │ God class decomp │
  │ API error│        │          │       │ ExecutorBase      │
  │ CodeQL   │        └──────────┘       │ Port interfaces   │
  └──────────┘                           │ Settings DI       │
       │                                 └──────────────────┘
       ▼                                        │
  P1 TypeSpec         P2 Agents               ▼
  ┌──────────┐       ┌──────────────┐    P2 Testing/DX/A11y/CI
  │ Date fix │       │ Rovo Dev     │    ┌──────────────────┐
  │ Validate │       │ Permissions  │    │ Test factories   │
  └──────────┘       │ Badges       │    │ Hooks            │
                     └──────────────┘    │ A11y fixes       │
                                         │ CI polish        │
                                         └──────────────────┘
  ```

  ## Implementation Strategy

  Phases are ordered by dependency and priority:
  1. Security first (P0) — all low-risk, high-value
  2. Correctness bugs next — executor fixes prevent data loss and hangs
  3. Architecture refactors — DI modularization is foundation for all subsequent decompositions
  4. TypeSpec modernization — date fix improves type safety across domain model
  5. Agent system — new agent + permission modes build on fixed executors
  6. Testing/DX/A11y/CI — independent items, can parallelize

  ## Testing Strategy (TDD: Tests FIRST)

  - Path sanitizer: 11 unit tests covering traversal, prefix attacks, normalization
  - Test factories: 17 tests validating factory builders
  - Repository batch methods: tested via existing repository test suites
  - Executor changes: verified via existing 241+ executor unit tests
  - A11y: manual verification + Storybook stories

  ## Risk Mitigation

  | Risk | Mitigation |
  | ---- | ---------- |
  | DI refactor breaks all services | Preserve exact same bindings; run full test suite |
  | God class decomposition misses a method | Facade pattern preserves all call sites |
  | TypeSpec date fix cascading type errors | Fix all 59 errors before committing |
  | ESLint broken by ajv override | Removed override, ajv 8.18.0 as direct dep suffices |
