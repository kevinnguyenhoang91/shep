decisions:
  - title: Adoption strategy
    chosen: Cherry-pick by theme, not by commit
    rejected:
      - Full merge of fork
      - Commit-by-commit cherry-pick
    rationale: >
      Fork includes rebrand commits and design system changes we don't want.
      Theme-based adoption lets us take security/architecture wins while skipping
      ShipIt-specific aesthetic choices.

  - title: DI modularization approach
    chosen: 8 focused module files with thin orchestrator
    rejected:
      - Keep monolithic container
      - Use decorators-only approach
    rationale: >
      Fork's pattern of 8 modules (database, repositories, services, agents,
      notifications, use-cases, interactive, web-tokens) maps cleanly to our
      existing registration groupings. Orchestrator reduced from 645 to 80 lines.

  - title: God class decomposition pattern
    chosen: Facade delegation preserving backward compatibility
    rejected:
      - Direct replacement of all call sites
      - Mixin-based decomposition
    rationale: >
      Facade pattern means zero call-site changes needed. Sub-services are internal
      implementation details. Callers can migrate to direct sub-service injection
      gradually over time.

  - title: TypeSpec date fix approach
    chosen: pnpm patch on emitter to add utcDateTime->Date mapping
    rejected:
      - Upgrade TypeSpec to 1.10 (risky major version jump)
      - Manual post-processing of generated output
    rationale: >
      Emitter patch is targeted and low-risk. Adds scalar mappings for utcDateTime,
      plainDate, plainTime, offsetDateTime -> Date. TypeSpec 1.10 upgrade deferred
      since 0.60 syntax is already compatible.

  - title: Permission mode granularity
    chosen: Three modes (Default, Strict, Autonomous) per agent
    rejected:
      - Per-tool permission matrix
      - Universal single mode for all agents
    rationale: >
      Three modes map cleanly to each executor's CLI flags. Per-tool matrix is
      over-engineering; universal mode ignores that agents have different flag systems.

