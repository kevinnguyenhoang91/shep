content: |
  ## Status

  - **Phase:** Research Complete
  - **Updated:** 2026-04-06

  ## Technology Decisions

  ### Adoption Strategy

  **Options considered:**
  1. Full merge of fork (rejected: includes rebrand and design changes)
  2. Commit-by-commit cherry-pick (rejected: 98 commits, many intertwined)
  3. Theme-based adoption (chosen: selective, prioritized by value)

  **Decision:** Theme-based adoption with subagent-driven implementation.

  ### DI Modularization

  Fork split 615-line container into 8 modules. We adopted the same pattern,
  reducing our 645-line container to 80 lines.

  ### God Class Decomposition

  Fork decomposed GitPrService and InteractiveSessionService. We adopted using
  facade pattern for backward compatibility.

  ### TypeSpec Date Fix

  Fork patched emitter via pnpm patch. We adopted the same approach, fixing 29
  `any`-typed date fields across the domain model.

  ## Security Considerations

  Critical security fixes adopted:
  - Command injection in open-shell.ts (path with shell metacharacters)
  - jq injection in github-repository.service.ts (unsanitized regex in jq filter)
  - Path traversal in 3 API routes (TOCTOU, prefix attacks, missing containment)
  - Stack trace exposure in error responses (apiError helper)
  - CVE overrides for ajv ReDoS and @anthropic-ai/sdk sandbox escape

  ## Performance Implications

  SSE polling reduced from ~2N+1 queries to 3 queries per poll cycle via batch
  repository methods (findByIds, findByRunIds). Executor stderr capped at 100KB
  to prevent memory exhaustion.
