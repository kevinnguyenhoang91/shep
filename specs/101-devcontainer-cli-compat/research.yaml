name: "devcontainer-cli-compat"
summary: >
  The devcontainer can stay intentionally small because the repo already has a
  Dockerfile-aligned Node 22 + pnpm 10.33.0 toolchain and the contributor need
  is focused on reliable `@devcontainers/cli` startup. The highest-value
  decisions are to keep dependency caches in Docker volumes, run as the non-root
  `node` user to avoid host file ownership issues, and keep the build context
  scoped to `.devcontainer/` because the image does not need repository files at
  build time.

