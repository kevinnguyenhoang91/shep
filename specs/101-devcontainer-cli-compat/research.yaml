decisions:
  - title: "Build context"
    chosen: "Use `.devcontainer` as the Docker build context."
    rejected:
      - "Use the repository root as build context even though the Dockerfile does not copy repository files."
    rationale: >
      The devcontainer image is built entirely from the Dockerfile and base
      image packages, so limiting context to `.devcontainer/` keeps
      `devcontainer up` faster and more deterministic without changing runtime
      behavior.
  - title: "Container user"
    chosen: "Run the workspace as the non-root `node` user."
    rejected:
      - "Keep the image default root user for all development commands."
    rationale: >
      Running as `node` avoids common bind-mount ownership problems on the host
      checkout while still allowing pnpm to use `/pnpm/store` after those paths
      are created with the correct ownership in the image.
  - title: "Dependency installation flow"
    chosen: "Treat the devcontainer setup as an alternative to the local install path."
    rejected:
      - "Document the devcontainer flow as an additional step after local `pnpm install`."
    rationale: >
      The devcontainer already runs `pnpm install --frozen-lockfile` during
      setup, so contributors should pick one path per checkout instead of
      installing dependencies twice.

