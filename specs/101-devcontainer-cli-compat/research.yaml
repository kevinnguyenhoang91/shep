content: |
  ## Problem Statement

  The repository had a production-oriented Dockerfile but no spec-complete
  devcontainer bundle for `@devcontainers/cli`, which left contributors without
  a documented containerized setup path and caused the new spec directory to
  fail the repository's YAML spec validation workflow.

  ## Findings

  - `scripts/spec-validate.ts` requires every YAML spec bundle to include
    `spec.yaml`, `research.yaml`, `plan.yaml`, `tasks.yaml`, and `feature.yaml`.
  - The existing devcontainer already matched the repo's Node and pnpm versions,
    so the remaining work was mainly around review hardening: narrowing build
    context, avoiding root-owned host files, and documenting the setup path more
    clearly.
  - Named Docker volumes remain the right choice for `node_modules` and the pnpm
    store because they preserve containerized dependency performance without
    polluting the host checkout.
