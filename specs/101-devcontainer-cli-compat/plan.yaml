content: |
  ## Architecture Overview

  The change is intentionally narrow and stays inside existing boundaries:

  - **Infrastructure config** — `.devcontainer/` owns the image/runtime behavior.
  - **Contributor documentation** — `docs/development/setup.md` explains how to
    use the setup without changing product code.
  - **Planning metadata** — the `specs/101-devcontainer-cli-compat/` bundle
    satisfies the repository's YAML-driven planning and validation workflow.

  This preserves Clean Architecture boundaries by keeping runtime environment
  concerns inside infrastructure/config files, contributor workflow guidance
  inside docs, and planning/state tracking inside the spec artifacts.

  ## Delivery Strategy

  1. **RED** — confirm the current review findings by checking the devcontainer
     config and the spec validator expectations.
  2. **GREEN** — patch the devcontainer, docs, and YAML bundle so the reported
     failures and mismatches are resolved.
  3. **REFACTOR** — tighten the wording in the docs/spec so the alternative setup
     path and review-state metadata are explicit and consistent.

  ## Verification

  - Run `pnpm spec:validate specs/101-devcontainer-cli-compat`.
  - Run `devcontainer read-configuration --workspace-folder .`.
  - Run `devcontainer up --workspace-folder .` and a small `devcontainer exec`
    smoke test to confirm the container still works after the review fixes.
