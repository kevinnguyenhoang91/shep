# Markdown content (the actual spec)
content: |
  ## Problem Statement

  The `CopilotCliExecutorService` (`packages/core/src/infrastructure/services/agents/common/executors/copilot-cli-executor.service.ts`) can freeze indefinitely after the `copilot` subprocess emits its final `result` JSONL event.

  Both `execute()` and `executeStream()` resolve only when the subprocess emits the `close` event. However, if any child process that the copilot agent spawned during its run (MCP servers, TypeScript language servers, background shells, or dev servers) keeps a stdio handle open, the parent `copilot` process never receives EOF and never closes. The worker then sleeps forever even though the agent has already finished and produced a result.

  This is the exact same bug that was previously fixed in `ClaudeCodeExecutorService` (documented in LESSONS.md under _"Subprocess Executor Must Not Trust Natural Exit After [result]"_). That fix added a `RESULT_TO_CLOSE_GRACE_MS = 30_000` timer: once the `result` event is observed, a 30-second countdown starts and sends `SIGKILL` if the process has not already exited. The copilot executor was implemented after that lesson was documented but did not include the safeguard.

  ## Success Criteria

  - [ ] SC-1: After `copilot` emits `type: 'result'`, if the process does not exit within 30 seconds, `SIGKILL` is sent.
  - [ ] SC-2: `execute()` resolves with the captured result (not an error) when killed via the grace timer.
  - [ ] SC-3: `executeStream()` yields the `result` event and the generator terminates when killed via the grace timer.
  - [ ] SC-4: The grace timer is cleared when the process exits normally before it fires (no spurious kills on fast exits).
  - [ ] SC-5: All existing unit tests for the copilot executor continue to pass.
  - [ ] SC-6: `pnpm validate` passes with zero errors after the change.

  ## Functional Requirements

  - **FR-1**: `CopilotCliExecutorService` MUST define a module-level constant `RESULT_TO_CLOSE_GRACE_MS = 30_000` with the same value as `ClaudeCodeExecutorService`.
  - **FR-2**: In `execute()`, upon observing a JSONL line with `type === 'result'`, the implementation MUST schedule a `setTimeout` callback that calls `proc.kill('SIGKILL')` after `RESULT_TO_CLOSE_GRACE_MS` milliseconds if no timer is already scheduled (idempotent guard using `??=`).
  - **FR-3**: In `execute()`, the `close` event handler MUST clear the grace timer via `clearTimeout` before resolving the promise, so normally-exiting processes are never spuriously killed.
  - **FR-4**: In `executeStream()`, upon observing a JSONL line with `type === 'result'`, the implementation MUST schedule the same `setTimeout` / `proc.kill('SIGKILL')` grace timer using the same idempotent guard.
  - **FR-5**: In `executeStream()`, the `close` event handler MUST clear the grace timer via `clearTimeout` before enqueuing the `null` sentinel that terminates the async generator.
  - **FR-6**: When the grace timer fires and `SIGKILL` is sent, `execute()` MUST resolve with whatever result data was captured from the `result` event — it MUST NOT reject or throw.
  - **FR-7**: When the grace timer fires and `SIGKILL` is sent, `executeStream()` MUST allow the async generator to terminate cleanly after the `close` event fires (which it will, because SIGKILL forces it).
  - **FR-8**: The unit test suite MUST include a test verifying that `execute()` sends `SIGKILL` after the grace period when the process does not self-close after emitting `result`.
  - **FR-9**: The unit test suite MUST include a test verifying that `executeStream()` sends `SIGKILL` after the grace period when the process does not self-close after emitting `result`.
  - **FR-10**: The unit test suite MUST include a test verifying that the grace timer does NOT fire (is cleared) when the process exits naturally within the grace window after emitting `result`.

  ## Non-Functional Requirements

  - **NFR-1 — Consistency**: The implementation pattern MUST be structurally identical to `ClaudeCodeExecutorService`. A future developer reading both executors side-by-side must see the same constant name, the same `??=` guard, and the same `clearTimeout` in the `close` handler. Deviating from the established pattern increases cognitive load and maintenance risk.
  - **NFR-2 — No new dependencies**: The fix MUST NOT introduce any new npm dependencies. All required primitives (`setTimeout`, `clearTimeout`, `proc.kill`) are available in the existing codebase.
  - **NFR-3 — Minimal diff**: The production code change MUST be approximately 10 lines or fewer added across the two methods. Any larger change is a signal that scope has drifted beyond the bug fix.
  - **NFR-4 — Test determinism**: Unit tests for the grace timer MUST use `vi.useFakeTimers()` to control `setTimeout` without real wall-clock delays. Tests MUST NOT sleep or use real timers.
  - **NFR-5 — Zero regressions**: All existing tests for `CopilotCliExecutorService` MUST continue to pass after the change. The fix touches existing code paths (`close` handler) and must not break them.
  - **NFR-6 — Type safety**: The `NodeJS.Timeout` return type of `setTimeout` MUST be used for the `postResultKillTimer` variable, consistent with the reference implementation. No `any` casts.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | What grace timer duration to use? | 30,000 ms (match reference) | Proven production value; fake timers make the exact number irrelevant in tests |
  | 2 | Which kill signal strategy? | Direct SIGKILL after grace period | SIGTERM is ignored by orphaned processes holding stdio; SIGKILL is unconditional |
  | 3 | Local or shared constant? | Local constant per executor | YAGNI — only two executors exist; shared file adds coupling with no current benefit |
  | 4 | execute() behavior on forced kill? | Resolve with captured result | Agent work succeeded; the hang is a cleanup artifact, not an agent failure |

  ## Codebase Analysis

  ### Project Structure

  The project uses Clean Architecture with four layers under `packages/core/src/`:
  - `domain/` — TypeSpec-generated types (`AgentType`, `AgentFeature`, `AgentConfig`)
  - `application/ports/output/agents/` — `IAgentExecutor` interface with `execute()` and `executeStream()`
  - `infrastructure/services/agents/common/executors/` — one concrete executor service per agent type
  - `presentation/` — CLI, TUI, Web UI layers that consume executors through the DI container

  ### Architecture Patterns

  - All executors implement `IAgentExecutor` and accept a `SpawnFunction` via constructor injection for testability without mocking `node:child_process` directly.
  - Executors spawn a subprocess, parse its stdout as JSONL line-by-line, and resolve via `proc.on('close')`.
  - `ClaudeCodeExecutorService` introduced `RESULT_TO_CLOSE_GRACE_MS` as a direct response to a real production hang (feature 92701aa8 was frozen for 3+ hours after the agent had committed and pushed). Any executor that waits for `proc.on('close')` and processes a terminal JSONL event must include this guard.

  ### Root Cause (Precise)

  In `CopilotCliExecutorService.execute()`, the `processLine` function handles `type === 'result'` and captures `sessionId` and `usage` but never schedules a kill timer. The promise only resolves when `proc.on('close')` fires:

  ```typescript
  // current — MISSING grace timer
  } else if (type === 'result') {
    if (parsed.sessionId) sessionId = parsed.sessionId as string;
    if (parsed.usage) usage = this.extractUsage(...);
    // no postResultKillTimer here — subprocess may never close
  }
  ```

  Compare with `ClaudeCodeExecutorService` which does:

  ```typescript
  if (parsed.type === 'result') {
    // ... capture data ...
    postResultKillTimer ??= setTimeout(() => {
      proc.kill('SIGKILL');
    }, RESULT_TO_CLOSE_GRACE_MS);
  }
  ```

  The same omission exists in `CopilotCliExecutorService.executeStream()`, where the `close` handler enqueues `null` to terminate the async generator. If the process never closes, the generator never returns.

  ### Relevant Technologies

  - **Node.js child_process spawn** — `SpawnFunction` type from `../types.js`; `proc.kill(signal)` sends OS signal to the subprocess
  - **SIGKILL** — forces termination without waiting for graceful cleanup; used because SIGTERM is insufficient when child processes hold stdio open
  - **JSONL** — `type: 'result'` is the terminal event from the copilot CLI's `--output-format json` mode

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `packages/core/src/infrastructure/services/agents/common/executors/copilot-cli-executor.service.ts` | High | Add `RESULT_TO_CLOSE_GRACE_MS` constant and `postResultKillTimer` variable; schedule SIGKILL in both `execute()` and `executeStream()`; clear timer in both `close` handlers |
  | `tests/unit/infrastructure/services/agents/executors/copilot-cli-executor.test.ts` | High | Add TDD tests using `vi.useFakeTimers()`: grace timer fires SIGKILL when process does not self-close after `result`; timer is cleared on normal fast exit |

  ## Dependencies

  - No new npm dependencies required.
  - Pattern is a direct port of `RESULT_TO_CLOSE_GRACE_MS` from `ClaudeCodeExecutorService` — already proven in production.
  - The `SpawnFunction` type already exposes `proc.kill(signal?: string)` accepting `'SIGKILL'`.
  - `vi.useFakeTimers()` is already available in the Vitest test suite used by existing executor tests.

  ## Size Estimate

  **S** — Single-file production change (~10 lines added across two methods), plus three new test cases (execute grace timer fires, executeStream grace timer fires, timer cleared on fast exit). No architectural changes, no TypeSpec changes, no new dependencies, no DI wiring changes needed. The entire fix is contained within `copilot-cli-executor.service.ts` and its test file.
