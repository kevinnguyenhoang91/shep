content: |
  ## Summary

  Work begins with 3 failing tests (phase-1) that precisely describe the missing
  behavior before any production code changes. Writing tests first proves they are
  meaningful — if they pass against the current code, something is wrong.

  Phase-2 implements the fix method-by-method. execute() comes first because its
  Promise-based structure is simpler than the async generator in executeStream(),
  making it easier to verify the pattern in isolation before applying it to the
  more complex streaming case. Each step is validated individually before moving on.

  Phase-3 runs pnpm validate and pnpm test:unit as the final gate, confirming
  zero regressions across the full test suite and static analysis pipeline.
