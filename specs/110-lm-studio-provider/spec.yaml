oneLiner: "Add LM Studio as a local LLM provider option"
summary: >
  Extend the agent executor system to support LM Studio, a local LLM runtime with an OpenAI-compatible API.
  Users can select LM Studio from agent settings to run inference locally without external API keys,
  extending Shep's existing support for Ollama and LLMProxy.
