summary: >
  Three intertwined product capabilities motivated by a real user's questions: (1) agent-to-agent
  communication during execution, (2) a user-delegated supervisor/watchdog agent that can monitor
  and intervene on the user's behalf, and (3) a clear, first-class flow for when running agents
  need to ask the user (or supervisor) questions. The codebase already has strong foundations —
  approval gates, SSE event streaming, AskUserQuestion via SDK V2, LangGraph workflows, and a
  draft team-execution protocol (spec 014) — but lacks a production-grade messaging fabric, a
  supervisor-agent role, and a unified question/escalation pipeline.
phase: "Requirements"
sizeEstimate: "L"

