$schema: https://json-schema.org/draft/2020-12/schema
$id: TelegramIntegrationConfig.yaml
type: object
properties:
  enabled:
    type: boolean
    default: false
    description: "Whether the Telegram bot is enabled (default: false)"
  botToken:
    type: string
    description: Telegram bot token from @BotFather (optional until enabled)
  authorizedUserId:
    type: string
    description: Authorized Telegram user ID as a decimal string (optional until enabled)
  authorizedUserLabel:
    type: string
    description: Display label for the authorized user (optional)
required:
  - enabled
description: Telegram bot integration configuration
